<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Sumemo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F4F5;color:#1F2A2E;font-family:system-ui,-apple-system,Roboto,sans-serif;font-size:20px}
button,input,a{font:inherit}
.scr{min-height:100dvh;padding:max(28px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:32px;line-height:1.1}
.sub{color:#4A575B}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:14px;min-height:620px}
.tile{border:2px solid #5E6B2F;border-radius:22px;background:#5E6B2F;color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;text-align:left;font-size:24px;font-weight:700}
.tile small{display:block;font-weight:400;font-size:16px;color:#EEF1E0}
.tile.p{background:#4A5522;border-color:#4A5522;color:#fff}
.tile svg{stroke:#fff}
.tile.p small{color:#fff}
.card{background:#fff;border:2px solid #BFC5AE;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.big{display:block;text-align:center;text-decoration:none;border:0;border-radius:22px;background:#5E6B2F;color:#fff;font-size:26px;font-weight:700;padding:22px}
.go{background:#14573A}
.no{background:#B42318}
.back{align-self:flex-start;border:0;background:none;color:#5E6B2F;font-size:20px;font-weight:700;padding:8px 0}
.small{border:2px solid #BFC5AE;background:#fff;border-radius:14px;padding:10px 16px;font-size:18px;align-self:flex-start}
label{display:flex;flex-direction:column;gap:6px;font-weight:700}
input,select{border:2px solid #BFC5AE;border-radius:16px;padding:14px;font-size:22px;background:#fff;width:100%}
.chips{display:flex;gap:10px}
.chip{flex:1;border:2px solid #BFC5AE;border-radius:18px;background:#fff;padding:18px 4px;font-size:22px;font-weight:700}
.chip.on{background:#5E6B2F;border-color:#5E6B2F;color:#fff}
.chip.on::before{content:'✓ '}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:2px solid #BFC5AE;border-radius:20px;background:#fff;color:#1F2A2E;padding:16px;font-size:20px}
.st{font-weight:700;text-align:right}
.st.pris{color:#14573A}
.st.pas{color:#B42318}
video{width:100%;border-radius:18px;background:#000}
.hero{font-size:36px;font-weight:700;line-height:1.1}
.flex1{flex:1;display:flex;flex-direction:column;gap:16px}
.flex1 .big{flex:1;display:flex;align-items:center;justify-content:center}
.chips{flex-wrap:wrap}.chip{flex:1 1 40%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{border:2px solid #BFC5AE;border-radius:12px;background:#fff;color:inherit;padding:6px 0;font-size:16px;min-height:52px}
.day.now{border:3px solid #5E6B2F}
.dark body,body.dark{background:#000;color:#F2EBDD}
.dark .sub{color:#B8AD98}
.dark .tile,.dark .big,.dark .chip.on{background:#E8DCC4!important;color:#1F2A2E!important;border-color:#E8DCC4}
.dark .big.go{background:#14573A!important;color:#fff!important}
.dark .big.no{background:#B42318!important;color:#fff!important}
.dark .tile small{color:#4A4030}
.dark .tile svg{stroke:#1F2A2E}
.dark .card,.dark .row,.dark .small,.dark .chip,.dark input,.dark select,.dark .day{background:#161616;color:#F2EBDD;border-color:#4A4438}
.dark .back{color:#E8DCC4}
.dark .day.now{border-color:#E8DCC4}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const K='meds-proto-v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{meds:[],proches:[],famille:[],log:{}};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
let view='home',tmp={};
const prompted=new Set();
const SLOTS={matin:['Matin','08:00'],midi:['Midi','12:00'],soir:['Soir','19:00']};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function today(){return ymd(new Date())}
const IC={
add:'<path d="M12 5v14M5 12h14"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
pro:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.5 0 4 1.8 4 4.5"/>',
fam:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
med:'<path d="M9 3h6v3H9z"/><path d="M7 6h10v14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z"/><path d="M7 12h10"/>',
pil:'<rect x="3" y="8" width="18" height="8" rx="4"/><path d="M12 8v8"/>',
set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
tel:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>'
};
const svg=(k,c)=>`<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const TILES=[
{v:'add',t:'Ajouter',s:'Scanner une boîte',i:'add'},
{v:'cal',t:'Calendrier',s:'Prises et dates',i:'cal'},
{v:'proches',t:'Mes proches',s:'Ils m’aident',i:'pro'},
{v:'famille',t:'Famille',s:'Coordonnées',i:'fam'},
{v:'meds',t:'Mes médicaments',s:'Ma pharmacie',i:'med'},
{v:'pill',t:'Pilule',s:'Calendrier',i:'pil'},
{v:'settings',t:'Paramètres',s:'Langue, thème',i:'set'},
{v:'call',t:'Appeler',s:'Proche ou médecin',i:'tel'}];
const back='<button class="back" onclick="go(\'home\')">← Accueil</button>';
function dosesOn(ds){const o=[];S.meds.forEach(m=>{const i=Math.round((new Date(ds+'T12:00')-new Date(m.start+'T12:00'))/864e5);if(i<0)return;let a=0;for(const p of m.phases){if(i<a+p.days){if((i-a)%p.every===0)p.times.forEach(t=>o.push({k:ds+'|'+m.id+'|'+t,m,t,q:p.qty}));break}a+=p.days}});if(pillOn(ds))o.push({k:ds+'|pill|'+S.pill.time,m:{id:'pill',name:'Pilule contraceptive',stock:null,phases:[]},t:S.pill.time,q:1});return o.sort((a,b)=>a.t.localeCompare(b.t))}
const doses=()=>dosesOn(today());
function left(m){if(m.stock==null)return null;let s=m.stock;for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()+i);const ds=ymd(d);for(const x of dosesOn(ds)){if(x.m!==m||(i===0&&S.log[x.k]))continue;s-=x.q;if(s<0)return i}}return 999}
function exp(e){if(!e)return['',''];const[y,m]=e.split('-').map(Number);const d=Math.ceil((new Date(y,m,0,23,59)-new Date())/864e5);return d<0?['Expiré','pas']:d<=60?['Expire bientôt','']:['OK','pris']}
const fm=e=>e?e.slice(5)+'/'+e.slice(0,4):'—';
const hm=t=>t.replace(':',' h ');
function go(v,t){stop();view=v;tmp=t||{};render()}
function render(){const f=V[view]||V.home;$('#app').innerHTML='<div class="scr">'+f()+'</div>';document.body.classList.toggle('dark',!!S.set.dark);document.documentElement.lang=S.set.lang;tr();window.scrollTo(0,0)}
function pv(kind,title,sub){
return back+`<h1>${title}</h1><div class="sub">${sub}</div>`+S[kind].map((p,i)=>`<div class="card"><b>${esc(p.name)}</b><span>${esc(p.phone)}</span><button class="small" onclick="del('${kind}',${i})">Retirer</button></div>`).join('')+
`<div class="card"><label>Prénom<input id="pn"></label><label>Téléphone<input id="pp" type="tel" inputmode="tel"></label><button class="big" onclick="addP('${kind}')">Ajouter</button></div>`}
const V={
home(){return '<div><div class="sub">Bonjour</div><h1>Que voulez-vous faire ?</h1></div><div class="grid">'+TILES.map((x,n)=>`<button class="tile${n?'':' p'}" onclick="go('${x.v}')">${svg(x.i,n?'#5E6B2F':'#fff')}<span>${x.t}<small>${x.s}</small></span></button>`).join('')+'</div><button class="small" style="align-self:center" onclick="go(\'about\')">'+'Qui sommes-nous ?'+'</button>'},
add(){return back+`<h1>Ajouter un médicament</h1>
<button class="big" onclick="tmp.mode='box';$('#f').click()">Photographier la boîte</button>
<button class="big" style="background:#fff;color:#5E6B2F;border:2px solid #5E6B2F" onclick="tmp.mode='rx';$('#f').click()">Photographier l’ordonnance</button>
<input type="file" id="f" accept="image/*" capture="environment" hidden onchange="onPhoto(this,tmp.mode)">
<div class="sub" id="scanmsg">La photo est lue sur votre téléphone. Vérifiez toujours les valeurs.</div>
<div id="cand" style="display:flex;flex-direction:column;gap:8px"></div>
<label>Nom<input id="n"></label>
<label>Date de péremption<input id="e" type="month"></label>
<label>Stock (nombre de comprimés)<input id="st" type="number" min="0" inputmode="numeric"></label>
<div><b>Schéma de prise</b></div>
<div id="ph">${phRow({days:60,every:1,qty:1,times:['08:00']})}</div>
<button class="small" onclick="$('#ph').insertAdjacentHTML('beforeend',phRow({days:3,every:1,qty:1,times:['08:00']}))">+ Ajouter une phase</button>
<button class="big go" onclick="saveMed()">Créer les rappels</button>`},
cal(){const ds=doses();let h=back+'<h1>Calendrier</h1><div class="sub">Aujourd’hui</div>';
if(!ds.length)h+='<div class="card">Aucun rappel. Ajoutez un médicament.</div>';
ds.forEach(x=>{const st=S.log[x.k];h+=`<button class="row" onclick="go('remind',{key:'${x.k}'})"><span><b>${hm(x.t)}</b> · ${x.q} cp<br>${esc(x.m.name)}</span><span class="st ${st||''}">${st==='pris'?'✓ Pris':st==='pas'?'✗ Pas pris':'À prendre'}</span></button>`});
const ren=S.meds.filter(m=>{const l=left(m);return l!==null&&l<=7});
if(ren.length)h+='<h1 style="font-size:26px;margin-top:12px">À renouveler</h1>'+ren.map(m=>`<div class="row"><span>${esc(m.name)}</span><span class="st pas">${left(m)} j restants</span></div>`).join('');
const soon=S.meds.filter(m=>exp(m.expiry)[0]&&exp(m.expiry)[0]!=='OK');
if(soon.length)h+='<h1 style="font-size:26px;margin-top:12px">Péremptions</h1>'+soon.map(m=>`<div class="row"><span>${esc(m.name)}</span><span class="st ${exp(m.expiry)[1]}">${exp(m.expiry)[0]}<br>${fm(m.expiry)}</span></div>`).join('');
return h},
remind(){const x=doses().find(d=>d.k===tmp.key);if(!x)return V.home();
return `<div class="sub">Rappel · ${hm(x.t)}</div><div class="hero">C’est l’heure de votre médicament</div><div class="card"><b style="font-size:28px">${esc(x.m.name)}</b><span class="sub">${x.q} comprimé(s)</span></div><div class="flex1"><button class="big go" onclick="answer('${x.k}',true)">✓ J’ai pris</button><button class="big no" onclick="answer('${x.k}',false)">✗ Pas pris</button></div>`},
alert(){const x=doses().find(d=>d.k===tmp.key);
if(!S.proches.length)return back+'<h1>Pas pris</h1><div class="card">Ajoutez d’abord un proche à prévenir.</div><button class="big" onclick="go(\'proches\')">Mes proches</button>';
const msg=encodeURIComponent('Bonjour, je n’ai pas pris mon médicament'+(x?' ('+x.m.name+' de '+hm(x.t)+')':'')+'.');
return '<h1>Prévenir un proche ?</h1><div class="sub">Un message SMS s’ouvre, il ne reste qu’à l’envoyer.</div>'+S.proches.map(p=>`<a class="big" href="sms:${p.phone.replace(/\s/g,'')}?body=${msg}">SMS à ${esc(p.name)}</a>`).join('')+'<button class="big" style="background:#fff;color:#1F2A2E;border:2px solid #BFC5AE" onclick="go(\'cal\')">Non merci</button>'},
proches(){return pv('proches','Mes proches','Ils sont prévenus par SMS si vous répondez « Pas pris ».')},
famille(){return pv('famille','Famille','Coordonnées des membres de la famille.')},
meds(){return back+'<h1>Mes médicaments</h1>'+(S.meds.length?S.meds.map((m,i)=>`<div class="card"><b>${esc(m.name)}</b><span>Péremption : ${fm(m.expiry)} · <span class="st ${exp(m.expiry)[1]}">${exp(m.expiry)[0]}</span></span><span class="sub">${m.phases.map(p=>p.days+' j × '+p.times.length+'/jour'+(p.every>1?' (tous les '+p.every+' j)':'')).join(' puis ')}</span><span>Stock : ${m.stock==null?'non renseigné':m.stock+' cp'+(left(m)<999?' · env. '+left(m)+' j':'')}</span><button class="small" onclick="setStock(${i})">Mettre à jour le stock</button><button class="small" onclick="delMed(${i})">Retirer</button></div>`).join(''):'<div class="card">Aucun médicament pour l’instant.</div>')},
about(){return back+'<h1>Qui sommes-nous ?</h1><div class="card"><div class="hero">Je suis celui qui se souvient.</div><div>Sumemo vient du latin : sum, « je suis », et memor, « qui se souvient ».</div><div>Pour vous et vos proches, Sumemo garde la mémoire des traitements, rappelle les prises et prévient quand il le faut.</div></div><div class="card sub">Sumemo n’est ni un dispositif médical ni un service d’urgence. Suivez toujours les indications de votre médecin ou pharmacien. En cas d’urgence : 144.</div><div class="sub" style="text-align:center">© 2026 Sumemo. Tous droits réservés.</div>'},
pill(){const p=S.pill||{time:'21:00',start:today(),a:21,b:7},L=LOC[S.set.lang],d=new Date();d.setDate(1);d.setMonth(d.getMonth()+(tmp.mo||0));
const y=d.getFullYear(),mo=d.getMonth(),n=new Date(y,mo+1,0).getDate(),off=(d.getDay()+6)%7;
let c=[...Array(7)].map((_,i)=>'<div class="sub">'+new Date(2024,0,1+i).toLocaleDateString(L,{weekday:'narrow'})+'</div>').join('')+'<div></div>'.repeat(off);
for(let j=1;j<=n;j++){const ds=ymd(new Date(y,mo,j)),on=pillOn(ds),mk=on===null?'':on===false?'—':pillTaken(ds)?'✓':ds<today()?'✗':'';
c+=`<button class="day${ds===today()?' now':''}" onclick="togglePill('${ds}')">${j}<br><b>${mk}</b></button>`}
return back+'<h1>Pilule contraceptive</h1>'+`<div class="card"><div class="row" style="border:0;padding:0;background:none"><button class="small" onclick="tmp.mo=(tmp.mo||0)-1;render()">←</button><b>${d.toLocaleDateString(L,{month:'long',year:'numeric'})}</b><button class="small" onclick="tmp.mo=(tmp.mo||0)+1;render()">→</button></div><div class="cal">${c}</div><div class="sub">✓ pris · ✗ oublié · — pause</div></div>`+(S.pill?'<button class="big go" onclick="setPill(today(),true);render()">J’ai pris ma pilule aujourd’hui</button>':'')+`<div class="card"><label>Heure de prise<input id="pt" type="time" value="${p.time}"></label><label>Début de la plaquette<input id="ps" type="date" value="${p.start}"></label><label>Type de plaquette<select id="pr">${['21,7','24,4','28,0'].map(v=>`<option value="${v}"${v===p.a+','+p.b?' selected':''}>${v.replace(',',' + ')}</option>`).join('')}</select></label><button class="big" onclick="savePill()">Enregistrer</button></div>`},
settings(){const P=S.patient,f=(id,l,v,ty)=>`<label>${l}<input id="${id}" value="${esc(v||'')}"${ty?` type="${ty}"`:''}></label>`,ch=(a,cur,fn)=>'<div class="chips">'+a.map(([v,l])=>`<button class="chip${v===cur?' on':''}" onclick="${fn}('${v}')">${l}</button>`).join('')+'</div>';
return back+'<h1>Paramètres</h1>'+`<div class="card"><b>Coordonnées patient</b>${f('pn','Prénom et nom',P.name)}${f('pb','Date de naissance',P.birth,'date')}${f('pf','Téléphone',P.phone,'tel')}${f('pa','Adresse',P.addr)}${f('pd','Médecin traitant',P.doc)}<button class="big" onclick="savePat()">Enregistrer</button></div><div class="card"><b>Langue</b>${ch([['fr','Français'],['it','Italiano'],['en','English'],['de','Deutsch'],['sq','Shqip']],S.set.lang,'setLang')}</div><div class="card"><b>Apparence</b>${ch([['0','Clair'],['1','Sombre']],S.set.dark?'1':'0','setDark')}</div>`},
call(){const all=S.proches.concat(S.famille);return back+'<h1>Appeler</h1>'+(all.length?all.map(p=>`<a class="big" href="tel:${p.phone.replace(/\s/g,'')}">${esc(p.name)}</a>`).join(''):'<div class="card">Ajoutez d’abord un proche ou un membre de la famille.</div>')}
};
function stop(){}
const LOC={fr:'fr-CH',it:'it-CH',en:'en-GB',de:'de-CH',sq:'sq-AL'};
function pillOn(ds){const p=S.pill;if(!p)return null;const i=Math.round((new Date(ds+'T12:00')-new Date(p.start+'T12:00'))/864e5);return i<0?null:(i%(p.a+p.b))<p.a}
const pillTaken=ds=>Object.keys(S.log).some(k=>k.startsWith(ds+'|pill|')&&S.log[k]==='pris');
function setPill(ds,on){Object.keys(S.log).filter(k=>k.startsWith(ds+'|pill|')).forEach(k=>delete S.log[k]);if(on)S.log[ds+'|pill|'+(S.pill?S.pill.time:'21:00')]='pris';save()}
function togglePill(ds){if(ds>today())return;setPill(ds,!pillTaken(ds));render()}
function savePill(){const t=$('#pt').value,st=$('#ps').value;if(!t||!st){alert('Indiquez l’heure et la date de début.');return}const ab=$('#pr').value.split(',');S.pill={time:t,start:st,a:+ab[0],b:+ab[1]};save();render()}
function savePat(){S.patient={name:$('#pn').value,birth:$('#pb').value,phone:$('#pf').value,addr:$('#pa').value,doc:$('#pd').value};save();render()}
function setLang(v){S.set.lang=v;save();render()}

const TR={'Bonjour':['Buongiorno','Hello','Guten Tag'],'Que voulez-vous faire ?':['Cosa vuoi fare?','What would you like to do?','Was möchten Sie tun?'],'Ajouter':['Aggiungi','Add','Hinzufügen'],'Scanner une boîte':['Scansiona una scatola','Scan a box','Packung scannen'],'Calendrier':['Calendario','Calendar','Kalender'],'Prises et dates':['Assunzioni e date','Doses and dates','Einnahmen und Daten'],'Mes proches':['I miei cari','My loved ones','Meine Angehörigen'],'Ils m’aident':['Mi aiutano','They help me','Sie helfen mir'],'Famille':['Famiglia','Family','Familie'],'Coordonnées':['Recapiti','Contact details','Kontaktdaten'],'Mes médicaments':['I miei farmaci','My medicines','Meine Medikamente'],'Ma pharmacie':['La mia farmacia','My pharmacy','Meine Apotheke'],'Appeler':['Chiama','Call','Anrufen'],'Proche ou médecin':['Familiare o medico','Relative or doctor','Angehörige oder Arzt'],'Pilule':['Pillola','Pill','Pille'],'Paramètres':['Impostazioni','Settings','Einstellungen'],'Langue, thème':['Lingua, tema','Language, theme','Sprache, Design'],'← Accueil':['← Home','← Home','← Start'],'Ajouter un médicament':['Aggiungi un farmaco','Add a medicine','Medikament hinzufügen'],'Photographier la boîte':['Fotografa la scatola','Photograph the box','Packung fotografieren'],'Photographier l’ordonnance':['Fotografa la ricetta','Photograph the prescription','Rezept fotografieren'],'Nom':['Nome','Name','Name'],'Date de péremption':['Data di scadenza','Expiry date','Verfallsdatum'],'Schéma de prise':['Schema di assunzione','Dosing schedule','Einnahmeschema'],'+ Ajouter une phase':['+ Aggiungi una fase','+ Add a phase','+ Phase hinzufügen'],'Créer les rappels':['Crea i promemoria','Create reminders','Erinnerungen erstellen'],'Aujourd’hui':['Oggi','Today','Heute'],'C’est l’heure de votre médicament':['È ora del tuo farmaco','It’s time for your medicine','Zeit für Ihr Medikament'],'✓ J’ai pris':['✓ Preso','✓ Taken','✓ Genommen'],'✗ Pas pris':['✗ Non preso','✗ Not taken','✗ Nicht genom Object.assign(TR,{"Qui sommes-nous ?": ["Chi siamo?", "About us", "Über uns", "Kush jemi ne?"], "Je suis celui qui se souvient.": ["Sono colui che ricorda.", "I am the one who remembers.", "Ich bin derjenige, der sich erinnert.", "Unë jam ai që kujton."], "Sumemo vient du latin : sum, « je suis », et memor, « qui se souvient ».": ["Sumemo viene dal latino: sum, «io sono», e memor, «che ricorda».", "Sumemo comes from Latin: sum, “I am”, and memor, “who remembers”.", "Sumemo kommt aus dem Lateinischen: sum, „ich bin“, und memor, „der sich erinnert“.", "Sumemo vjen nga latinishtja: sum, «unë jam», dhe memor, «që kujton»."], "Pour vous et vos proches, Sumemo garde la mémoire des traitements, rappelle les prises et prévient quand il le faut.": ["Per voi e i vostri cari, Sumemo ricorda le terapie, ricorda le assunzioni e avvisa quando serve.", "For you and your loved ones, Sumemo keeps track of treatments, reminds you of doses and alerts when needed.", "Für Sie und Ihre Angehörigen merkt sich Sumemo die Behandlungen, erinnert an die Einnahmen und warnt, wenn nötig.", "Për ju dhe të afërmit tuaj, Sumemo mban mend trajtimet, kujton marrjet dhe njofton kur duhet."], "Sumemo n’est ni un dispositif médical ni un service d’urgence. Suivez toujours les indications de votre médecin ou pharmacien. En cas d’urgence : 144.": ["Sumemo non è un dispositivo medico né un servizio di emergenza. Seguite sempre le indicazioni del medico o del farmacista. In caso di emergenza: 144.", "Sumemo is neither a medical device nor an emergency service. Always follow your doctor’s or pharmacist’s advice. In an emergency: 144.", "Sumemo ist weder ein Medizinprodukt noch ein Notfalldienst. Befolgen Sie immer die Anweisungen Ihres Arztes oder Apothekers. Im Notfall: 144.", "Sumemo nuk është pajisje mjekësore dhe as shërbim urgjence. Ndiqni gjithmonë udhëzimet e mjekut ose farmacistit. Në rast urgjence: 144."], "© 2026 Sumemo. Tous droits réservés.": ["© 2026 Sumemo. Tutti i diritti riservati.", "© 2026 function tr(){const i={it:0,en:1,de:2,sq:3}[S.set.lang];if(i===undefined)return;const w=document.createTreeWalker($('#app'),NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const t=n.nodeValue.trim();if(TR[t])n.nodeValue=n.nodeValue.replace(t,TR[t][i])}}
const phRow=p=>`<div class="card ph"><label>Pendant (jours)<input class="d" type="number" min="1" value="${p.days}"></label><label>Tous les (jours)<input class="e" type="number" min="1" value="${p.every}"></label><label>Heures (ex. 08:00, 20:00)<input class="t" value="${p.times.join(', ')}"></label><label>Comprimés par prise<input class="q" type="number" min="0.5" step="0.5" value="${p.qty}"></label><button class="small" onclick="this.parentNode.remove()">Retirer la phase</button></div>`;
const setPhases=a=>{$('#ph').innerHTML=a.map(phRow).join('')};
const normT=t=>t.split(/[,; ]+/).filter(Boolean).map(x=>{const[h,m]=x.replace(/h/i,':').split(':');return String(+h).padStart(2,'0')+':'+String(+(m||0)).padStart(2,'0')});
async function ocr(img,m){if(!window.Tesseract){m.textContent='Chargement du lecteur de texte…';await new Promise((ok,ko)=>{const c=document.createElement('script');c.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';c.onload=ok;c.onerror=ko;document.head.appendChild(c)})}
m.textContent='Lecture en cours…';const w=await Tesseract.createWorker('fra');const r=await w.recognize(img);await w.terminate();return r.data.text}
function parseRx(l){const o={name:l.replace(/\d.*$/,'').trim()||l,phases:null};
const p=l.match(/\b(\d)\s*[-–]\s*(\d)\s*[-–]\s*(\d)(?:\s*[-–]\s*(\d))?\b/),d=l.match(/(\d+)\s*(jours?|semaines?|mois)/i);
if(p){let days=60;if(d)days=+d[1]*(/sem/i.test(d[2])?7:/mois/i.test(d[2])?30:1);const T=['08:00','12:00','19:00','22:00'],t=[],q=[];[p[1],p[2],p[3],p[4]].forEach((v,i)=>{if(v&&+v>0){t.push(T[i]);q.push(+v)}});o.phases=[{days,every:1,qty:q[0]||1,times:t}]}return o}
async function onPhoto(inp,mode){const f=inp.files[0];if(!f)return;const m=$('#scanmsg');
try{const b=await createImageBitmap(f),k=Math.min(1,1800/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
let ok=false;if(mode==='box'&&'BarcodeDetector' in window){try{const r=await new BarcodeDetector().detect(c);const g=r.length&&r[0].rawValue.replace(/[()]/g,'').match(/01\d{14}17(\d{2})(\d{2})/);if(g){$('#e').value='20'+g[1]+'-'+g[2];ok=true}}catch(e){}}
const txt=await ocr(c,m);
if(!ok){const g=txt.match(/(?:EXP|Verw\.?bis|Ablauf|Exp)[^\d]{0,10}(\d{1,2})[\/.\- ](\d{2,4})/i);if(g){const y=g[2].length===2?'20'+g[2]:g[2];$('#e').value=y+'-'+g[1].padStart(2,'0')}}
tmp.cands=[...new Set(txt.split('\n').map(l=>l.replace(/[^\p{L}\d .,%\/–-]/gu,'').trim()).filter(l=>(l.match(/\p{L}/gu)||[]).length>=4))].slice(0,10).map(l=>mode==='rx'?parseRx(l):{name:l.replace(/\d.*$/,'').trim()||l,line:l});
tmp.cands.forEach(x=>x.line=x.line||x.name);
$('#cand').innerHTML=tmp.cands.map((x,i)=>`<button class="small" style="align-self:stretch;text-align:left" onclick="useCand(${i})">${esc(x.line||x.name)}</button>`).join('');
m.textContent=tmp.cands.length?'Touchez la ligne qui correspond au médicament, puis vérifiez tout.':'Rien de lisible : réessayez avec plus de lumière ou saisissez à la main.'
}catch(e){m.textContent='Lecture impossible ici : saisissez à la main.'}
inp.value=''}
function useCand(i){const c=tmp.cands[i];if(c.name)$('#n').value=c.name.trim();if(c.phases)setPhases(c.phases)}
function saveMed(){
const name=$('#n').value.trim(),e=$('#e').value,slots=[...document.querySelectorAll('.chip.on')].map(c=>c.dataset.s);
if(!name||!slots.length){alert('Indiquez le nom et au moins un moment de la journée.');return}
S.meds.push({id:Date.now(),name,expiry:e,slots});save();
if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
go('cal')}
function delMed(i){if(confirm('Retirer ce médicament ?')){S.meds.splice(i,1);save();render()}}
function addP(kind){const name=$('#pn').value.trim(),phone=$('#pp').value.trim();if(!name||!phone){alert('Indiquez un prénom et un numéro.');return}S[kind].push({name,phone});save();render()}
function del(kind,i){if(confirm('Retirer cette personne ?')){S[kind].splice(i,1);save();render()}}
function answer(k,ok){const x=doses().find(d=>d.k===k),was=S.log[k];if(x&&x.m.stock!=null){if(ok&&was!=='pris')x.m.stock=Math.max(0,x.m.stock-x.q);if(!ok&&was==='pris')x.m.stock+=x.q}S.log[k]=ok?'pris':'pas';save();go(ok?'cal':'alert',{key:k})}
function notify(x){if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('C’est l’heure',{body:x.m.name,tag:x.k,requireInteraction:true}))}
setInterval(()=>{if(view!=='home'&&view!=='cal')return;
const n=new Date(),t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
const x=doses().find(d=>d.t<=t&&!S.log[d.k]&&!prompted.has(d.k));
if(x){prompted.add(x.k);notify(x);go('remind',{key:x.k})}},15000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
S.meds.forEach(m=>{if(!m.phases){m.phases=[{days:3650,every:1,qty:1,times:m.slots.map(x=>SLOTS[x][1])}];m.start=today();if(m.stock===undefined)m.stock=null}});
S.set=S.set||{lang:'fr',dark:false};S.patient=S.patient||{};
save();
render();
</script>
